<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Sound Boxes</title>
<!-- Sound Boxes (Visanduku vya Sauti): a Somo game. Original work by the Somo team. Built from games-src/ by tools/build-games.mjs. -->
<style>:root{--bg:#1F140E;--panel:#2E1E15;--accent:#F2B829;--good:#3FA34D;--text:#FFF7EA;--paper:#FFF8EC;--ink:#2B1E17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:600 18px/1.25 "Baloo 2","Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 8px}.top .lv{font-weight:800;font-size:17px;white-space:nowrap}
.dots{flex:1;display:flex;gap:4px}.dots i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}.dots i.on{background:var(--accent)}.dots i.cur{background:#fff}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:var(--text);display:grid;place-items:center;font:800 24px/1 system-ui;flex:none}
.ib svg{width:26px;height:26px}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,.tok:focus-visible,.slot:focus-visible{outline:4px solid #FFD447;outline-offset:2px}
.bub{margin:0 10px;padding:8px 12px;background:var(--paper);color:var(--ink);border-radius:14px;min-height:44px;font-size:17px;display:flex;align-items:center;gap:8px}
.bub .who{flex:none;width:34px;height:34px}
#play{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;min-height:0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{background:var(--paper);color:var(--ink);border-radius:16px;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;min-height:84px;padding:6px}
.tok{touch-action:none}.tok.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(242,184,41,.45)}.tok.lift{position:relative;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.tok.gone{visibility:hidden}.tok.try{animation:nudge .4s}.tok.good,.card.good{border-color:var(--good);box-shadow:0 0 0 4px rgba(63,163,77,.45)}.glow{animation:glow 1s infinite alternate}
.slot{border:3px dashed rgba(255,255,255,.5);border-radius:16px;min-width:84px;min-height:84px;display:grid;place-items:center}.slot.hot{border-color:var(--accent);background:rgba(242,184,41,.15)}
.big{min-height:64px;padding:10px 24px;border-radius:32px;border:0;background:var(--good);color:#fff;font-weight:800;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.25)}.big.ghost{background:rgba(255,255,255,.15)}.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.word{font-weight:800;font-size:30px;letter-spacing:.02em;font-family:"Andika","Comic Sans MS","Trebuchet MS",sans-serif}
.letter{font-weight:800;font-size:34px;font-family:"Andika","Comic Sans MS","Trebuchet MS",sans-serif}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;flex:1;padding:16px}.center h1{margin:0;font-size:32px}.center p{margin:0;max-width:320px}
.ex{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,12,8,.92);border:2px solid var(--accent);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:40}
.ex b{color:var(--accent)}
.pause{position:absolute;inset:0;background:rgba(20,12,8,.9);display:grid;place-items:center;z-index:90;font-size:26px;font-weight:800}
@keyframes nudge{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}@keyframes glow{to{box-shadow:0 0 0 6px rgba(242,184,41,.7)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}.pop{animation:pop .35s ease-out}
.rm *{animation:none!important;transition:none!important}

  /* word → its sounds (graphemes) */
  const W3 = { egg: ['e', 'g'], cat: ['c', 'a', 't'], dog: ['d', 'o', 'g'], sun: ['s', 'u', 'n'], pig: ['p', 'i', 'g'], hen: ['h', 'e', 'n'], cup: ['c', 'u', 'p'], bus: ['b', 'u', 's'], hat: ['h', 'a', 't'], net: ['n', 'e', 't'], pot: ['p', 'o', 't'], map: ['m', 'a', 'p'], pan: ['p', 'a', 'n'], tin: ['t', 'i', 'n'], bed: ['b', 'e', 'd'], fish: ['f', 'i', 'sh'], duck: ['d', 'u', 'ck'], rat: ['r', 'a', 't'], jug: ['j', 'u', 'g'], mop: ['m', 'o', 'p'], fan: ['f', 'a', 'n'], log: ['l', 'o', 'g'] };
  const W4 = { frog: ['f', 'r', 'o', 'g'], drum: ['d', 'r', 'u', 'm'], flag: ['f', 'l', 'a', 'g'], nest: ['n', 'e', 's', 't'], crab: ['c', 'r', 'a', 'b'], desk: ['d', 'e', 's', 'k'], hand: ['h', 'a', 'n', 'd'], plum: ['p', 'l', 'u', 'm'], stop: ['s', 't', 'o', 'p'], lamp: ['l', 'a', 'm', 'p'], tent: ['t', 'e', 'n', 't'], milk: ['m', 'i', 'l', 'k'] };
  const SIM = { b: 'd', d: 'b', p: 'b', m: 'n', n: 'm', t: 'd', a: 'u', u: 'a', e: 'i', i: 'e', o: 'a', g: 'k', s: 'z', f: 'v', l: 'r', r: 'l' };
  const sounds = g => g.map(x => SAY[x] || x).join('... ');
  const readable = (w, g) => g.every(x => x.length === 1 ? K.canRead(x) : x === 'ck' ? K.canRead('ck') : false);
  K.game({ id: 'sound-boxes', levels: 3, skill: () => 'seg', icon: K.pic('three', 110),
    items(lv) {
      if (lv === 1) return K.shuffle(Object.entries(W3)).slice(0, 8).map(([w, g]) => ({ lv, w, g, tiles: false }));
      if (lv === 2) { let pool = Object.entries(W3).filter(([w, g]) => g.every(x => x.length === 1) && readable(w, g)); if (pool.length < 8) pool = Object.entries(W3).filter(([w, g]) => g.every(x => x.length === 1)).slice(0, 10); return K.shuffle(pool).slice(0, 8).map(([w, g]) => ({ lv, w, g, tiles: true })); }
      return K.shuffle(Object.entries(W4)).slice(0, 8).map(([w, g]) => ({ lv, w, g, tiles: readable(w, g) }));
    },
    render(spec, it, root) {
      const { w, g } = spec, n = g.length;
      const p = () => K.say(spec.tiles ? 'spell' : 'hear', { w }); K.setPrompt(p); p();
      const boxes = spec.tiles ? n : 5;
      root.innerHTML = `<div class="card">${K.pic(w, 90)}</div><div class="row" id="boxes">${Array.from({ length: boxes }, (_, i) => `<div class="slot" data-b="${i}" style="min-width:60px;min-height:64px"></div>`).join('')}</div>
        ${spec.tiles ? `<div class="row" id="tray">${K.shuffle([...g, ...[SIM[g[0]], SIM[g[n - 2]]].filter(x => x && !g.includes(x))]).map((x, i) => `<button class="card tok letter" data-l="${x}" style="min-width:60px;min-height:60px">${x}</button>`).join('')}</div>`
          : `<div class="row"><button class="card tok" id="bead" style="min-width:70px" aria-label="Bead"><svg width="44" height="44"><circle cx="22" cy="22" r="18" fill="#E8577A"/><circle cx="16" cy="16" r="5" fill="#F7B3C4"/></svg></button></div><div class="row"><button class="big ghost" id="clr">${K.esc(K.line('clear'))}</button><button class="big" id="ok">${K.esc(K.line('done'))}</button></div>`}`;
      const B = K.$$('#boxes .slot', root);
      if (!spec.tiles) {
        let k = 0; const put = () => { if (k >= boxes) return; B[k].innerHTML = '<svg width="40" height="40"><circle cx="20" cy="20" r="16" fill="#E8577A"/></svg>'; k++; K.sayText(SAY[g[k - 1]] ? String(k) : String(k)); };
        K.dnd(root, { onDrop: (el, slot) => put(), onTapSlot: () => put() });
        K.$('#clr', root).onclick = () => { k = 0; B.forEach(b => b.innerHTML = ''); };
        K.$('#ok', root).onclick = () => { if (!k) return; if (k === n) { K.sayText(sounds(g), 'en'); it.right(); } else { k = 0; B.forEach(b => b.innerHTML = ''); it.miss('segCount'); } };
      } else {
        let k = 0;
        K.dnd(root, { onTap: el => K.sayText(SAY[el.dataset.l] || el.dataset.l, 'en'), onDrop: (el, slot) => {
          const l = el.dataset.l; if (l === g[k]) { B[k].innerHTML = `<span class="letter">${l}</span>`; B[k].classList.add('good'); el.classList.add('gone'); K.sayText(SAY[l], 'en'); k++; if (k === n) it.right(); }
          else { el.classList.remove('try'); void el.offsetWidth; el.classList.add('try'); it.miss('aeiou'.includes(l) ? 'vowel' : SIM[g[k]] === l ? 'similarSound' : 'segCount'); } } });
      }
    },
    nudge(spec) { spec.tiles ? K.say('nudge2', { w: spec.w }) : K.say('nudge1', { s: sounds(spec.g) }); },
    example(spec) { K.example(`<div class="row">${spec.g.map(x => `<div class="slot" style="min-width:52px;min-height:52px"><span class="letter">${spec.tiles ? x : '●'}</span></div>`).join('')}</div>`, 'ex', { w: spec.w, s: sounds(spec.g), n: spec.g.length }); },
    reveal(spec, it) { it.right(false); },
  });
})();

</script></body></html>
